name: Egypt map data

# Builds the offline map package for the MMI navigation: OpenMapTiles-schema
# vector tiles (egypt.mbtiles) and the place-search index (egypt-search.db).
# Copy both files to a USB stick and import them from the Navigation page.
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/map/**"
      - ".github/workflows/map-data.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Egypt OpenStreetMap extract
        run: curl -fsSL --retry 3 -o egypt.osm.pbf https://download.geofabrik.de/africa/egypt-latest.osm.pbf

      - name: Build vector tiles
        run: |
          curl -fsSL --retry 3 -o planetiler.jar https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar
          java -Xmx10g -jar planetiler.jar \
            --osm-path=egypt.osm.pbf --download \
            --languages=en,ar \
            --output=egypt.mbtiles --force
          ls -la egypt.mbtiles

      - name: Build search index
        run: |
          pip install --quiet osmium
          python tools/map/build_search_index.py egypt.osm.pbf egypt-search.db
          ls -la egypt-search.db

      # Far more shops, restaurants, clinics and offices than OSM alone. Optional:
      # if Overture is unreachable the OSM-only index is kept.
      - name: Add Overture Maps places
        continue-on-error: true
        run: |
          pip install --quiet overturemaps
          overturemaps download --bbox=24.6,21.9,36.95,31.7 -f geojsonseq --type=place -o places.geojsonseq
          ls -la places.geojsonseq
          python tools/map/merge_overture.py places.geojsonseq egypt-search.db
          ls -la egypt-search.db

      - name: Extract speed limits and cameras
        run: |
          python tools/map/build_road_safety.py egypt.osm.pbf egypt-safety.db
          ls -la egypt-safety.db

      - name: Build routing graph
        run: |
          pip install --quiet numpy
          python tools/map/build_routing_graph.py egypt.osm.pbf egypt-routing.graph
          ls -la egypt-routing.graph

      - name: Upload map package
        uses: actions/upload-artifact@v4
        with:
          name: egypt-map-data
          path: |
            egypt.mbtiles
            egypt-search.db
            egypt-safety.db
            egypt-routing.graph
          compression-level: 1
          if-no-files-found: error

      # The app's "Download maps" button fetches from this release; a file whose
      # size changed is downloaded again, so pressing it updates the maps.
      - name: Publish to the maps-egypt release
        if: github.ref == 'refs/heads/mbux'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload maps-egypt egypt-safety.db egypt-routing.graph egypt-search.db egypt.mbtiles --clobber

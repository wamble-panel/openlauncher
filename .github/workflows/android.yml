name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Built-in AirPlay: its native libraries (UxPlay, FFmpeg, OpenSSL) are built on the
      # "airplay" branch (no secrets there) and only downloaded here, checked against
      # their published SHA-256. Without them the build still works; AirPlay is then off.
      - name: Fetch AirPlay native libraries
        run: |
          base=https://github.com/${{ github.repository }}/releases/download/airplay-latest
          if curl -fsSL -o airplay-native.zip "$base/airplay-native.zip" && curl -fsSL -o airplay-native.zip.sha256 "$base/airplay-native.zip.sha256"; then
            sha256sum -c airplay-native.zip.sha256
            mkdir -p airplay/src/main/jniLibs
            unzip -q -o airplay-native.zip -d airplay-native
            # Only AirPlay's own libraries (the zip also holds AndroidX helpers MMI already has).
            for d in airplay-native/lib/*/; do
              abi=$(basename "$d"); mkdir -p "airplay/src/main/jniLibs/$abi"
              for so in libairplay_native.so libcrypto.so liboboe.so libc++_shared.so; do
                [ -f "$d$so" ] && cp "$d$so" "airplay/src/main/jniLibs/$abi/"
              done
            done
            find airplay/src/main/jniLibs -name '*.so' | sort
          else
            echo "::warning::AirPlay native libraries not published yet; building without AirPlay"
          fi

      # New MMI screens (Flutter module mmi_ui): page renders at 1280 x 800, then the
      # release AAR the APK is built with.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Flutter page renders and AAR
        working-directory: mmi_ui
        run: |
          flutter pub get
          flutter analyze
          flutter test --update-goldens
          flutter build aar --no-debug --no-profile --build-number 1.0 --target-platform android-arm,android-x64

      - name: Attach Flutter renders to the mmi-screens release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/mbux'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view mmi-screens > /dev/null 2>&1 || gh release create mmi-screens --title "MMI screenshots" --notes "Latest page screenshots (1280x800)."
          mkdir -p fshots
          for f in mmi_ui/goldens/*.png; do cp "$f" "fshots/flutter_$(basename "$f")"; done
          gh release upload mmi-screens fshots/* --clobber

      # Optional: a stable signing key so each new debug APK installs over the
      # previous one on the head unit. Without it every runner generates a fresh
      # debug key and Android refuses the update (signature mismatch).
      - name: Install shared debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          # Passed to Gradle explicitly: the runner's Android setup ignores ~/.android.
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mmi.keystore"
          echo "MMI_KEYSTORE=$RUNNER_TEMP/mmi.keystore" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      # The car's Android is 32-bit only: the APK must carry 32-bit ARM libraries (and only
      # those), including Flutter's and, when published, AirPlay's.
      - name: Check native libraries
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          unzip -l "$apk" 'lib/*' | awk '{print $4}' | grep '^lib/' | sort | tee libs.txt
          grep -q '^lib/armeabi-v7a/libflutter.so$' libs.txt || { echo "libflutter.so (armeabi-v7a) missing"; exit 1; }
          grep -q '^lib/armeabi-v7a/libapp.so$' libs.txt || { echo "libapp.so (armeabi-v7a) missing"; exit 1; }
          if [ -d airplay/src/main/jniLibs/armeabi-v7a ]; then
            for so in libairplay_native.so libcrypto.so liboboe.so libc++_shared.so; do
              grep -q "^lib/armeabi-v7a/$so$" libs.txt || { echo "$so (armeabi-v7a) missing"; exit 1; }
            done
          fi
          if grep -v '^lib/armeabi-v7a/' libs.txt; then echo "Libraries for another ABI found (above)"; exit 1; fi

      # A build signed with any other key can't update MMI on the car, so stop here.
      - name: Check signing key
        if: env.MMI_KEYSTORE != ''
        run: |
          keytool -printcert -jarfile app/build/outputs/apk/release/*.apk | grep -q "9B:96:7D:15:FE:98:2A:B9:68:89:39:94:DE:61:97:35:61:8F:A8:48" \
            || { echo "Release APK is not signed with the shared key"; exit 1; }

      # Install this one on the car: optimised, not debuggable, much smoother.
      - name: Upload fast APK
        uses: actions/upload-artifact@v4
        with:
          name: openlauncher-INSTALL-THIS-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Plain .apk download (no zip): each mbux build replaces MMI.apk on the
      # owner's existing "install-mmi" release, so the link never changes.
      - name: Attach MMI.apk to the install-mmi release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/mbux'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/release/*.apk MMI.apk
          gh release upload install-mmi MMI.apk --clobber
          # Fingerprint MMI checks before installing an update (damaged or swapped downloads are refused).
          sha256sum MMI.apk | cut -d' ' -f1 > MMI.sha256
          gh release upload install-mmi MMI.sha256 --clobber
          # Uploaded after the APK, so Settings → Software update never sees a version without its file.
          echo $(( ${{ github.run_number }} + 1000 )) > version.txt
          gh release upload install-mmi version.txt --clobber

      # Same app with x86_64 code added, only for the screenshot emulator (the car's APK stays ARM-only).
      - name: Assemble emulator APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/mbux'
        run: |
          mkdir -p emu
          ./gradlew --no-daemon assembleRelease -Pemulator
          cp app/build/outputs/apk/release/*.apk emu/MMI-emulator.apk

      - name: Upload emulator APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/mbux'
        uses: actions/upload-artifact@v4
        with:
          name: openlauncher-emulator-${{ github.sha }}
          path: emu/MMI-emulator.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openlauncher-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # Screenshots of every MMI page on an Android 10 emulator at the car screen's size
  # (1280 x 800, mdpi), attached to the "mmi-screens" release so the UI can be checked
  # against the designs without the car.
  screens:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/mbux'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openlauncher-emulator-${{ github.sha }}
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 1280x800
          disable-animations: false
          script: |
            adb shell wm size 1280x800
            adb shell wm density 160
            adb install -r -g apk/*.apk
            adb shell cmd package set-home-activity com.openlauncher.app/.MainActivity
            adb shell appops set com.openlauncher.app WRITE_SETTINGS allow
            mkdir -p shots
            for p in HOME SETTINGS GENERAL_SET DISPLAY SOUND EQ CONN_SET BLUETOOTH BT_HUB PHONE CONTACTS MUSIC SOURCE RADIO APPS DASHBOARD DIAGNOSTICS CAR_SET SYSTEM_SET NAV; do adb shell am start -n com.openlauncher.app/.MainActivity --es mmi_page $p > /dev/null; sleep 4; adb exec-out screencap -p > shots/$p.png; done
            for p in home settings display sound radio music source apps calls dial btsearch carinfo weather; do adb shell am start -n com.openlauncher.app/.MainActivity --es flutter_page $p > /dev/null; sleep 5; adb exec-out screencap -p > shots/fl_$p.png; done
            # The owner's 7-inch screen (1024 x 600): classic pages must scale to fit too.
            adb shell am force-stop com.openlauncher.app; adb shell wm size 1024x600; sleep 3
            for p in SYSTEM_SET BT_HUB DIAGNOSTICS HOME; do adb shell am start -n com.openlauncher.app/.MainActivity --es mmi_page $p > /dev/null; sleep 5; adb exec-out screencap -p > shots/7in_$p.png; done
            adb shell wm size 1280x800

      - name: Attach screenshots to the mmi-screens release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view mmi-screens > /dev/null 2>&1 || gh release create mmi-screens --title "MMI screenshots" --notes "Latest page screenshots from the emulator (1280x800)."
          echo "${{ github.sha }}" > shots/commit.txt
          gh release upload mmi-screens shots/* --clobber

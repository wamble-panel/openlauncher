name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Optional: a stable signing key so each new debug APK installs over the
      # previous one on the head unit. Without it every runner generates a fresh
      # debug key and Android refuses the update (signature mismatch).
      - name: Install shared debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      # Install this one on the car: optimised, not debuggable, much smoother.
      - name: Upload fast APK
        uses: actions/upload-artifact@v4
        with:
          name: openlauncher-INSTALL-THIS-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openlauncher-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: app/build/reports/tests/
          if-no-files-found: ignore

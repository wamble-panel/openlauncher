name: MMI AirPlay native libraries
# The native part of MMI's built-in AirPlay (UxPlay, FFmpeg, OpenSSL, libplist), built
# here so MMI's own build never compiles or runs third-party build scripts:
#  1. build:   compiles everything with no secrets and a read-only token;
#  2. publish: puts the libraries (lib/<abi>/*.so) on the "airplay-latest" release as
#              airplay-native.zip, which MMI's build downloads into its airplay module.
on:
  push:
    branches: [airplay]
  workflow_dispatch:
concurrency:
  group: mmi-airplay
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease --stacktrace
      - name: Collect native libraries
        run: |
          mkdir -p native && cd native
          unzip -q -o ../app/build/outputs/apk/release/*.apk 'lib/*'
          find lib -name '*.so' | sort
          zip -q -r ../airplay-native.zip lib
          cd .. && sha256sum airplay-native.zip | tee airplay-native.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: airplay-native
          path: |
            airplay-native.zip
            airplay-native.zip.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: airplay-native
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view airplay-latest > /dev/null 2>&1 || gh release create airplay-latest --prerelease --target "$GITHUB_SHA" \
            --title "MMI AirPlay native libraries" --notes "UxPlay-based AirPlay receiver libraries for MMI (fork of jqssun/android-airplay-server, GPL-3.0). Source: the airplay branch."
          gh release upload airplay-latest airplay-native.zip airplay-native.zip.sha256 --clobber

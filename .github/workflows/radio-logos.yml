name: Radio logos (collect)
# One-off helper: collects Egyptian radio stations and logo candidates for review,
# onto the branch radio-logos-data (not shipped; logos are checked by hand first).
on:
  push:
    paths: [tools/radio_logos.py, .github/workflows/radio-logos.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/radio_logos.py
      - name: Save to the radio-logos-data branch
        run: |
          cd out
          git init -q -b radio-logos-data
          git config user.name "radio-logos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Egyptian radio stations and logo candidates (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" radio-logos-data
